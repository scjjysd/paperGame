# 纸上游戏机 · 角色异步服务全栈（S1 尖刺 + 角色异步服务）
# 管理 TorchServe 推理服务、Redis 队列、FastAPI 服务与渲染 worker。
#
# AnimatedDrawings 源码随仓库提供，启动前可执行 scripts/setup/setup-vendor.sh 校验，
# 首次构建镜像约 5-7 分钟，请为 Docker 分配至少 16GB 内存。
#
#   bash scripts/setup/setup-vendor.sh && docker compose up -d --build
#   curl http://localhost:8080/ping             # {"status": "Healthy"}
#   curl http://localhost:8000/healthz        # {"status":"ok"}
#   curl https://scjjysd.xyz:8443/healthz     # {"status":"ok"}
#   Nginx 提供 HTTP/HTTPS；启动前放置 certs/scjjysd.xyz.pem 和 certs/scjjysd.xyz.key，详见 README。
#
# GPU 开关（单文件，环境变量控制）：
#   默认不启用 GPU：docker compose up -d          ← 现阶段唯一可用配置
#   ⚠️ 现阶段不要开 GPU_RUNTIME=nvidia：镜像内 mmcv-full 1.7.0 是「无 CUDA kernel」的源码编译版
#      （openmmlab 的 cu117/torch2.0.0 轮子索引里只有 1.7.2，mim 找不到 1.7.0 预编译轮子而退化为
#        源码编译；基镜像 continuumio/miniconda3 无 nvcc → MMCV_WITH_CUDA 未定义 → 只注册 CPU 实现）。
#      而 torch==2.0.0 的 PyPI 默认轮子本身带 CUDA，容器一看得见 GPU，mmdet/mmpose 的 handler 就按
#        torch.cuda.is_available() 把模型搬到 cuda:0（不看 TorchServe 分配的 gpu_id），推理走到 NMS 抛
#        "nms_impl: implementation for dev`ice cuda:0 not found." → /predictions 全部 503。
#      必须保留 nvidia runtime 时，给本服务加 CUDA_VISIBLE_DEVICES: "" 把 GPU 从 torch 视野藏掉，退回 CPU。
#      真要 GPU 加速见文末说明。

services:
  torchserve:
    build:
      context: vendor/AnimatedDrawings/torchserve
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    image: paper-game/ad-torchserve:local
    container_name: ad-torchserve
    # GPU 开关：默认 runc 完全不发起 GPU 请求（Mac 无 GPU 正常跑）；
    # GPU_RUNTIME=nvidia 时走 nvidia runtime，容器内可见 GPU。
    # 注：不采用 devices+count:0 方案——实测无 GPU 宿主机上 count=0 的设备请求
    #     仍会报 "failed to discover GPU vendor from CDI"，故用 runtime 切换实现单文件开关。
    runtime: ${GPU_RUNTIME:-runc}
    # NAS 挂载可能丢失脚本的可执行位；由镜像内 shell 解释，只需脚本可读。
    entrypoint: ["/bin/sh", "/torchserve-entrypoint.sh"]
    environment:
      # 仅 nvidia runtime 下生效；默认全部 GPU，可填具体序号/UUID 限定
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # N 分别应用于检测和姿态模型；留空保持 TorchServe 原生默认。
      TORCHSERVE_WORKERS_PER_MODEL: ${TORCHSERVE_WORKERS_PER_MODEL:-}
    volumes:
      - ./docker/torchserve-entrypoint.sh:/torchserve-entrypoint.sh:ro
    ports:
      - "8080:8080"   # TorchServe 推理 API（涂鸦分析：检测/分割/骨架）
      - "8081:8081"   # TorchServe 管理 API
    healthcheck:
      # 镜像内不保证有 curl，用 python 标准库探活
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://localhost:8080/ping', timeout=3)" || exit 1
      interval: 10s
      timeout: 5s
      retries: 18        # 模型加载较慢，给足启动窗口
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 16g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pg-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
    image: paper-game/server:local
    container_name: pg-api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    environment:
      REDIS_URL: redis://redis:6379/0
      OUT_ROOT: /data/out
      # 留空时按请求协议和 Host（含外部端口）推导，兼容 HTTP 与 HTTPS 同时访问。
      # 自动部署读取仓库外 nas.env；仅需固定统一地址时才设置此变量。
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # 跨域：默认放开所有来源（本地/内网联调）；要携带凭证就得配成具体来源
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      # 日志：落 /data/out/logs（即宿主机 out/logs），文件名带日期；LOG_KEEP_DAYS=0 表示不清理
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_KEEP_DAYS: ${LOG_KEEP_DAYS:-0}
    # API 不发布宿主机端口，仅信任容器网络；外部请求统一由 Nginx 重写代理头。
    # 不要在信任所有代理头的同时将 API 端口直接暴露到公网。
    volumes:
      - ./out:/data/out
      - ./webgl:/app/webgl:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-sf", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    container_name: pg-nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 校验两个入口都能代理至 API；仅内部 localhost 探活跳过证书域名验证。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz && wget --no-check-certificate -q -O /dev/null https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  worker:
    image: paper-game/server:local
    container_name: pg-worker
    command: ["python", "-m", "app.workers.character_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OUT_ROOT: /data/out
      RENDER_USE_MESA: "true"
      TORCHSERVE_UPSTREAM: torchserve:8080
      ANALYZE_TIMEOUT_SECONDS: ${ANALYZE_TIMEOUT_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_KEEP_DAYS: ${LOG_KEEP_DAYS:-0}
    volumes:
      - ./out:/data/out
    depends_on:
      torchserve:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started   # 确保镜像已构建（api 与 worker 同镜像）
    stop_grace_period: 300s   # >= SUBPROCESS_TIMEOUT(120s) x MAX_ATTEMPTS(2) + 余量，防 docker 默认 10s SIGKILL 打断渲染
    restart: unless-stopped

  level-worker:
    image: paper-game/server:local
    container_name: pg-level-worker
    command: ["python", "-m", "app.workers.level_worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OUT_ROOT: /data/out
      LEVEL_LLM_BASE_URL: ${LEVEL_LLM_BASE_URL:-}
      LEVEL_LLM_API_KEY: ${LEVEL_LLM_API_KEY:-}
      LEVEL_LLM_MODEL: ${LEVEL_LLM_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_KEEP_DAYS: ${LOG_KEEP_DAYS:-0}
    volumes:
      - ./out:/data/out
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    stop_grace_period: 200s   # >= SUBPROCESS_TIMEOUT(90s) x MAX_ATTEMPTS(2) + 余量
    restart: unless-stopped

# GPU 说明：通过上方 GPU_RUNTIME 环境变量切换（单文件实现，无需 override 文件）。
# worker 渲染保持 Mesa 软渲染（GPU 环境也能正常工作）；
# 如需 GPU 硬件渲染需 Xvfb+EGL 改造，收益小暂不启用。
#
# 真要让 TorchServe 吃上 GPU，必须重建 torchserve 镜像、让 mmcv-full 带 CUDA kernel，二选一：
#   (a) 换 CUDA devel 基镜像（cu117，与 torch==2.0.0 默认轮子对齐）+ FORCE_CUDA=1
#       + TORCH_CUDA_ARCH_LIST 从源码编 mmcv-full 1.7.0：版本矩阵不动，但编译慢、吃内存。
#   (b) 换官方预编译轮子 mmcv-full==1.7.2
#       -f https://download.openmmlab.com/mmcv/dist/cu117/torch2.0.0/index.html：不用编译，
#       但必须同时放宽 mmpose 0.29.0 的 mmcv_maximum_version（值为 '1.7.0'，断言用 <=），
#       否则 pose 那个 .mar 一 import mmpose 就断言失败。
#   收益评估：GPU 只加速检测+姿态这一段；worker 的 ARAP + Mesa 软渲染占单张 8~18s 的大头，
#   完全不受 GPU 影响。动手前先实测 TorchServe 那段在总耗时里的占比。
