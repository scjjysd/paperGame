# 两个协议共用同一个入口配置，不强制 HTTP 跳转 HTTPS。
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /certs/scjjysd.xyz.pem;
    ssl_certificate_key /certs/scjjysd.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # API 单文件上限 10 MiB，为 multipart 留出余量。
    client_max_body_size 20m;
    # API 容器重建后通过 Docker DNS 重新解析，避免代理继续连接旧容器 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # 必须使用 http_host 保留外部 8000/8443 端口。
        proxy_set_header Host $http_host;
        # 覆盖客户端伪造的转发头，Uvicorn 只接收容器网络流量。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_read_timeout 300s;
        proxy_redirect off;
    }
}
