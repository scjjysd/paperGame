<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="TemplateData/favicon.ico">
    <link rel="manifest" href="manifest.json">
    <title>PaperGame</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-warning"></div>
      <div id="build-time">出包时间：2026-09-18 13:41:09 UTC+8</div>
    </div>
    <button id="fullscreen-btn" onclick="enterFullscreen()">全屏</button>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var fullscreenBtn = document.getElementById("fullscreen-btn");

      /* PWA standalone 模式下隐藏全屏按钮 */
      if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
        fullscreenBtn.style.display = "none";
      }

      function unityShowBanner(message, type) {
        var item = document.createElement("div");
        item.textContent = message;
        item.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(item);
        if (type !== "error") {
          setTimeout(function () { item.remove(); }, 5000);
        }
      }

      function enterFullscreen() {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (fn) { fn.call(el).catch(function () {}); }
        fullscreenBtn.style.display = "none";
      }

      // 固定横屏逻辑舞台。视口变化只做等比矩阵变换，不改变 WebGL 渲染缓冲。
      var stageWidth = 1;
      var stageHeight = 1;
      var unityPortrait = false;

      function viewportSize() {
        var viewport = window.visualViewport;
        return {
          width: viewport ? viewport.width : window.innerWidth,
          height: viewport ? viewport.height : window.innerHeight
        };
      }

      function layoutUnityStage() {
        var viewport = viewportSize();
        var viewportWidth = Math.max(1, viewport.width);
        var viewportHeight = Math.max(1, viewport.height);
        unityPortrait = viewportHeight > viewportWidth;

        var scale;
        var offsetX;
        var offsetY;
        if (unityPortrait) {
          scale = Math.min(viewportWidth / stageHeight, viewportHeight / stageWidth);
          offsetX = (viewportWidth - stageHeight * scale) / 2;
          offsetY = (viewportHeight - stageWidth * scale) / 2;
          container.style.transform = 'matrix(' + [
            0, scale, -scale, 0, offsetX + stageHeight * scale, offsetY
          ].join(',') + ')';
        } else {
          scale = Math.min(viewportWidth / stageWidth, viewportHeight / stageHeight);
          offsetX = (viewportWidth - stageWidth * scale) / 2;
          offsetY = (viewportHeight - stageHeight * scale) / 2;
          container.style.transform = 'matrix(' + [
            scale, 0, 0, scale, offsetX, offsetY
          ].join(',') + ')';
        }
      }

      function initializeUnityCanvas() {
        var viewport = viewportSize();
        stageWidth = Math.max(viewport.width, viewport.height);
        stageHeight = Math.min(viewport.width, viewport.height);
        container.style.width = stageWidth + 'px';
        container.style.height = stageHeight + 'px';
        layoutUnityStage();

        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(stageWidth * dpr));
        canvas.height = Math.max(1, Math.round(stageHeight * dpr));
      }
      initializeUnityCanvas();
      window.addEventListener("resize", layoutUnityStage);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", layoutUnityStage);
      }

      // Unity 按包围盒归一化输入；先逆旋转，再映射回同一个包围盒坐标系。
      function unityPointerPosition(point, rect) {
        var x = rect.left + (point.clientY - rect.top) * rect.width / rect.height;
        var y = rect.top + (rect.right - point.clientX) * rect.height / rect.width;
        return { clientX: x, clientY: y, pageX: x + window.scrollX, pageY: y + window.scrollY };
      }

      function unityTouchList(touches, rect) {
        var list = Array.prototype.map.call(touches, function (touch) {
          return Object.assign({
            identifier: touch.identifier, target: touch.target,
            screenX: touch.screenX, screenY: touch.screenY,
            radiusX: touch.radiusX, radiusY: touch.radiusY,
            rotationAngle: touch.rotationAngle, force: touch.force
          }, unityPointerPosition(touch, rect));
        });
        list.item = function (index) { return list[index] || null; };
        return list;
      }

      var unityMouseDown = false;
      function normalizeUnityInput(event) {
        var targetsCanvas = event.target === canvas || unityMouseDown;
        if (event.type === "mousedown") { unityMouseDown = event.target === canvas; }
        if (event.type === "mouseup") { unityMouseDown = false; }
        if (!targetsCanvas || !unityPortrait) { return; }
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) { return; }
        var values = event.changedTouches ? {
          touches: unityTouchList(event.touches, rect),
          targetTouches: unityTouchList(event.targetTouches, rect),
          changedTouches: unityTouchList(event.changedTouches, rect)
        } : unityPointerPosition(event, rect);
        // 保留原始可信事件及用户手势，不重新派发，避免重复点击和多点触摸丢失。
        Object.keys(values).forEach(function (key) {
          Object.defineProperty(event, key, { configurable: true, value: values[key] });
        });
      }
      ["mousedown", "mousemove", "mouseup", "touchstart", "touchmove", "touchend", "touchcancel"]
        .forEach(function (type) { document.addEventListener(type, normalizeUnityInput, true); });
      window.addEventListener("blur", function () { unityMouseDown = false; });

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/C1WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/C1WebGL.data.gz?v=1",
        frameworkUrl: buildUrl + "/C1WebGL.framework.js.gz?v=1",
        codeUrl: buildUrl + "/C1WebGL.wasm.gz?v=1",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PaperGame",
        productVersion: "0.1",
        matchWebGLToCanvasSize: false,
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then(function () {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
